<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.bahorai.com/" />
    
    <!-- Primary Meta Tags -->
    <title>Bahor AI – Birinchi o'zbek sun'iy intellekti</title>
    <meta name="title" content="Bahor AI – Birinchi o'zbek sun'iy intellekti" />
    <meta name="description" content="Birinchi o'zbek tiliga moslangan sun'iy intellekt yordamchi. ChatGPT'dan arzonroq, osonroq va o'zbeklar uchun yaratilgan." />
    <meta name="author" content="Bahor AI" />
    <meta name="theme-color" content="#3da9a1" />

    <!-- Favicon - Multiple formats for maximum compatibility -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bahor AI" />

    <!-- Preload critical font (single weight for first paint) -->
    <link rel="preload" href="/fonts/NotoSans-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    
    <!-- Font face declarations with font-display: swap for performance -->
    <style>
      @font-face {
        font-family: 'Noto Sans';
        src: url('/fonts/NotoSans-Regular.woff2') format('woff2'),
             url('/fonts/NotoSans-Regular.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans';
        src: url('/fonts/NotoSans-Bold.woff2') format('woff2'),
             url('/fonts/NotoSans-Bold.woff') format('woff');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /* Critical CSS for fast first paint */
      html { background-color: #0f0f0f; }
      body { font-family: 'Noto Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Open Graph / Facebook / Instagram / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bahorai.com/" />
    <meta property="og:title" content="Bahor AI – Birinchi o'zbek sun'iy intellekti" />
    <meta property="og:description" content="Birinchi o'zbek tiliga moslangan sun'iy intellekt yordamchi. ChatGPT'dan arzonroq, osonroq va o'zbeklar uchun yaratilgan." />
    <meta property="og:image" content="https://www.bahorai.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="640" />
    <meta property="og:site_name" content="Bahor AI" />
    <meta property="og:locale" content="uz_UZ" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.bahorai.com/" />
    <meta name="twitter:title" content="Bahor AI – Birinchi o'zbek sun'iy intellekti" />
    <meta name="twitter:description" content="Birinchi o'zbek tiliga moslangan sun'iy intellekt yordamchi. ChatGPT'dan arzonroq, osonroq va o'zbeklar uchun yaratilgan." />
    <meta name="twitter:image" content="https://www.bahorai.com/og.png" />
  </head>

  <body>
    <script>
      // Flash prevention: set dark mode immediately before React loads
      (function() {
        var stored = localStorage.getItem('bahorai_theme');
        if (stored === 'light') return; // User explicitly chose light
        // Default to dark always (ignore system preference)
        document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => console.log('SW registered:', registration))
            .catch(error => console.log('SW registration failed:', error));
        });
      }
    </script>
  </body>
</html>
